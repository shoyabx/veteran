name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps (if present)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
          fi
      - name: Run frontend lint (if present)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm run lint --if-present
          fi

  test:
    name: Tests and Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
      - name: Validate database migrations
        env:
          DATABASE_URL: sqlite:///:memory:
          TOKEN_ENCRYPTION_KEY: '5-wMIo1OYqeg87ZJDdrjiFALFGKAao7mTD-8vakdY6M='
          JWT_SECRET_KEY: test-secret-key-change-me-change-me-change-me
        run: |
          cd backend
          PYTHONPATH=. alembic upgrade head
      - name: Validate backend startup checks
        env:
          DATABASE_URL: sqlite:///:memory:
          TOKEN_ENCRYPTION_KEY: '5-wMIo1OYqeg87ZJDdrjiFALFGKAao7mTD-8vakdY6M='
          JWT_SECRET_KEY: test-secret-key-change-me-change-me-change-me
        run: |
          cd backend
          PYTHONPATH=. python -c "from app.main import app; print('FastAPI App loaded and initialized successfully!')"
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///:memory:
          TOKEN_ENCRYPTION_KEY: '5-wMIo1OYqeg87ZJDdrjiFALFGKAao7mTD-8vakdY6M='
          JWT_SECRET_KEY: test-secret-key-change-me-change-me-change-me
        run: |
          cd backend
          PYTHONPATH=. pytest app/tests -v

  docker-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker compose syntax
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config -q
          fi

  deploy-validation:
    name: Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment manifests (placeholder)
        run: |
          if [ -d infrastructure ]; then
            echo "Infrastructure directory present. Add terraform/k8s validators here."
          fi
