version: "3.9"
services:
  api:
    image: veteran-api:dev
    build:
      context: ./backend
    env_file:
      - .env.example
    ports:
      - "8000:8000"

  frontend:
    image: veteran-frontend:dev
    build:
      context: ./frontend
    env_file:
      - .env.example
    ports:
      - "3000:3000"
