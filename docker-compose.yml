version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: veteran-postgres
    environment:
      POSTGRES_DB: veteran
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veteran"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - veteran_pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veteran
      JWT_SECRET_KEY: change-me
      JWT_ALGORITHM: HS256
      TOKEN_ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
      OPENAI_API_KEY: replace-me
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - veteran_attachments:/data/attachments
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ingestion-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker.ingestion_worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veteran
      JWT_SECRET_KEY: change-me
      JWT_ALGORITHM: HS256
      TOKEN_ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
      OPENAI_API_KEY: replace-me
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - veteran_attachments:/data/attachments

  embedding-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker.embedding_worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veteran
      JWT_SECRET_KEY: change-me
      JWT_ALGORITHM: HS256
      TOKEN_ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
      OPENAI_API_KEY: replace-me
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - veteran_attachments:/data/attachments

  indexing-scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker.indexing_scheduler"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veteran
      JWT_SECRET_KEY: change-me
      JWT_ALGORITHM: HS256
      TOKEN_ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
      OPENAI_API_KEY: replace-me
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  retrieval-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker.retrieval_worker"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/veteran
      JWT_SECRET_KEY: change-me
      JWT_ALGORITHM: HS256
      TOKEN_ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
      OPENAI_API_KEY: replace-me
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  dead-letter-queue:
    image: alpine:3.20
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 2

  frontend:
    build:
      context: ./frontend
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
      AZURE_CLIENT_ID: replace-me
      AZURE_CLIENT_SECRET: replace-me
      AZURE_TENANT_ID: common
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  veteran_pg_data:
  veteran_attachments:
